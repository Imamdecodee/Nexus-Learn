<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ILM Nexus News Article</title>
    <meta name="description" content="Read the latest news and updates from ILM Nexus.">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <link id="articleCanonical" rel="canonical" href="https://ilmnexus.pro/article.html">
    <meta id="articleOgTitle" property="og:title" content="ILM Nexus News Article">
    <meta id="articleOgDescription" property="og:description" content="Read the latest news and updates from ILM Nexus.">
    <meta id="articleOgImage" property="og:image" content="https://ilmnexus.pro/image/nexus-learn%20logo.png">
    <meta id="articleOgUrl" property="og:url" content="https://ilmnexus.pro/article.html">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="ILM Nexus Academy">
    <meta name="twitter:card" content="summary_large_image">
    <meta id="articleTwitterTitle" name="twitter:title" content="ILM Nexus News Article">
    <meta id="articleTwitterDescription" name="twitter:description" content="Read the latest news and updates from ILM Nexus.">
    <meta id="articleTwitterImage" name="twitter:image" content="https://ilmnexus.pro/image/nexus-learn%20logo.png">
    <script id="articleStructuredData" type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","publisher":{"@type":"Organization","name":"Ilm Nexus","url":"https://ilmnexus.tech/"}}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        :root { --blue: #4361ee; --blue-dark: #2336a7; --ink: #172033; --muted: #718096; --light: #f3f6fc; --border: #e5eaf3; --purple: #7c3aed; }
        * { box-sizing: border-box; }
        body { margin: 0; color: var(--ink); background: radial-gradient(ellipse at 50% -15%, #dfe7ff 0, transparent 44rem), var(--light); font-family: Inter, sans-serif; line-height: 1.75; }
        .container { width: min(1120px, calc(100% - 2rem)); margin: 0 auto; }
        .site-header { position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.9); border-bottom: 1px solid rgba(229,234,243,.85); backdrop-filter: blur(16px); }
        .nav { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
        .logo img { width: 128px; height: auto; display: block; }
        .back-link { color: var(--ink); text-decoration: none; font-weight: 700; display: inline-flex; align-items: center; gap: .65rem; }
        .back-link:hover { color: var(--blue); }
        .article-shell { margin: 2.5rem auto 4rem; background: white; border: 1px solid rgba(229,234,243,.9); border-radius: 26px; overflow: hidden; box-shadow: 0 28px 80px rgba(35,54,110,.14); }
        .article-hero { position: relative; min-height: 430px; display: flex; align-items: end; isolation: isolate; background: linear-gradient(135deg,#18254d,#4361ee); }
        .article-cover { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; }
        .article-hero::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg,rgba(10,18,42,.86),rgba(10,18,42,.43) 60%,rgba(10,18,42,.08)),linear-gradient(0deg,rgba(10,18,42,.3),transparent 58%); }
        .hero-copy { width: min(900px,100%); padding: clamp(1.5rem,6vw,4.5rem); color: white; }
        .article-category { display: inline-flex; padding: .45rem .9rem; border: 1px solid rgba(255,255,255,.34); border-radius: 999px; background: rgba(255,255,255,.14); color: white; font-size: .78rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; backdrop-filter: blur(8px); }
        h1 { max-width: 850px; margin: 1rem 0 .8rem; font: 800 clamp(2.1rem,5.6vw,4.35rem)/1.08 Poppins, sans-serif; letter-spacing: -.035em; text-wrap: balance; }
        .article-intro { max-width: 760px; margin: 0 0 1.3rem; color: rgba(255,255,255,.88); font-size: clamp(1rem,2vw,1.2rem); }
        .article-meta { display: flex; flex-wrap: wrap; gap: .7rem 1.25rem; color: rgba(255,255,255,.8); font-size: .9rem; }
        .article-layout { display: grid; grid-template-columns: minmax(0,1fr) 250px; gap: clamp(2rem,5vw,4.5rem); padding: clamp(1.4rem,5vw,4rem); }
        .article-content { color: #35425a; font-size: 1.12rem; overflow-wrap: anywhere; }
        .article-content p { margin: 0 0 1.25em; }
        .article-content a, .related-links a, .source-link { color: var(--blue-dark); font-weight: 700; text-decoration: underline; text-decoration-color: #a9b8ff; text-underline-offset: 3px; overflow-wrap: anywhere; }
        .article-content a:hover, .related-links a:hover, .source-link:hover { color: var(--purple); text-decoration-color: currentColor; }
        .article-side { align-self: start; position: sticky; top: 100px; padding: 1.25rem; border: 1px solid var(--border); border-radius: 18px; background: linear-gradient(145deg,#f8faff,#f1f4ff); }
        .article-side h2 { margin: 0 0 .8rem; font: 700 1rem Poppins,sans-serif; }
        .article-side p { margin: 0 0 1rem; color: var(--muted); font-size: .9rem; }
        .share-button { display: inline-flex; align-items: center; justify-content: center; gap: .55rem; width: 100%; padding: .8rem 1rem; border: 0; border-radius: 12px; color: white; background: linear-gradient(120deg,var(--blue),var(--purple)); font: 700 .9rem Inter,sans-serif; cursor: pointer; box-shadow: 0 8px 18px #4361ee33; }
        .share-button:hover { transform: translateY(-1px); box-shadow: 0 12px 24px #4361ee44; }
        .section-heading { margin: 2.5rem 0 1rem; font: 700 1.3rem Poppins,sans-serif; }
        .article-video { width: 100%; aspect-ratio: 16 / 9; border: 0; margin-top: 2rem; border-radius: 16px; background: #10182b; }
        .article-video-file { width: 100%; margin-top: 2rem; border-radius: 16px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1rem; margin-top: 1rem; }
        .gallery img { width: 100%; height: 230px; object-fit: cover; border-radius: 16px; box-shadow: 0 10px 24px #17203319; }
        .related-links { display: grid; gap: .75rem; margin-top: 1rem; }
        .related-links a { display: flex; gap: .7rem; align-items: center; padding: .9rem 1rem; border: 1px solid var(--border); border-radius: 12px; background: #fbfcff; text-decoration: none; }
        .source-link { display: inline-flex; align-items: center; gap: .5rem; margin-top: 1rem; padding: .75rem 1rem; border-radius: 12px; background: #edf1ff; text-decoration: none; }
        .status { width: min(780px,calc(100% - 2rem)); margin: 4rem auto; padding: 2.5rem; text-align: center; color: var(--muted); border: 1px solid var(--border); border-radius: 20px; background: white; }
        .site-footer { padding: 2rem 1rem; color: #78839a; text-align: center; font-size: .9rem; }
        @media (max-width: 760px) { .article-layout { grid-template-columns: 1fr; } .article-side { position: static; grid-row: 1; } .article-hero { min-height: 390px; } }
        @media (max-width: 520px) { .nav { min-height: 64px; } .logo img { width: 105px; } .article-shell { margin-top: 1rem; border-radius: 18px; } .article-hero { min-height: 430px; } .hero-copy { padding: 1.3rem; } .article-layout { padding: 1.3rem; } .gallery img { height: 190px; } }
    </style>
</head>
<body>
    <header class="site-header">
        <nav class="nav container">
            <a class="logo" href="index.html"><img src="./image/nexus-learn logo.png" alt="ILM Nexus"></a>
            <a class="back-link" href="news.html"><i class="fas fa-arrow-left"></i> All News</a>
        </nav>
    </header>

    <main class="container">
        <div id="articleStatus" class="status">Loading article...</div>
        <article id="articleShell" class="article-shell" hidden>
            <header class="article-hero">
                <img id="articleCover" class="article-cover" alt="">
                <div class="hero-copy">
                    <div id="articleCategory" class="article-category"></div>
                    <h1 id="articleTitle"></h1>
                    <p id="articleIntro" class="article-intro"></p>
                    <div class="article-meta">
                        <span id="articleDate"></span>
                        <span id="articleViews"></span>
                    </div>
                </div>
            </header>
            <div class="article-layout">
                <div class="article-main">
                    <div id="articleContent" class="article-content"></div>
                    <iframe id="articleVideo" class="article-video" title="Article video" allowfullscreen hidden></iframe>
                    <video id="articleVideoFile" class="article-video-file" controls hidden></video>
                    <div id="gallerySection" hidden>
                        <h2 class="section-heading">More from this story</h2>
                        <div id="articleGallery" class="gallery"></div>
                    </div>
                    <div id="linksSection" hidden>
                        <h2 class="section-heading">Explore the links</h2>
                        <div id="articleLinks" class="related-links"></div>
                    </div>
                    <a id="articleSource" class="source-link" target="_blank" rel="noopener noreferrer" hidden>Read the related story <i class="fas fa-arrow-up-right-from-square"></i></a>
                </div>
                <aside class="article-side">
                    <h2>Share this story</h2>
                    <p>Pass this update along to your community.</p>
                    <button class="share-button" id="shareArticleButton" type="button"><i class="fas fa-link"></i> Copy article link</button>
                </aside>
            </div>
        </article>
    </main>
    <footer class="site-footer">© <span id="footerYear"></span> ILM Nexus Limited · Ilorin, Kwara State, Nigeria</footer>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import { doc, getDoc, getFirestore, increment, updateDoc } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: 'AIzaSyBJKtNJDIxbo-_PxSwGTYcuS8gRjg9ReX8',
            authDomain: 'ilmnexusnews.firebaseapp.com',
            projectId: 'ilmnexusnews',
            storageBucket: 'ilmnexusnews.firebasestorage.app',
            messagingSenderId: '434251311563',
            appId: '1:434251311563:web:0264d1049c463369862e4e'
        };
        const db = getFirestore(initializeApp(firebaseConfig));
        const pathArticleId = window.location.pathname.match(/^\/share\/article\/([^/]+)\/?$/)?.[1];
        const articleId = new URLSearchParams(window.location.search).get('id')
            || (pathArticleId ? decodeURIComponent(pathArticleId) : null);
        const status = document.getElementById('articleStatus');

        function youtubeEmbed(url) {
            try {
                const parsed = new URL(url);
                const videoId = parsed.hostname.includes('youtu.be') ? parsed.pathname.slice(1) : parsed.searchParams.get('v');
                return videoId ? `https://www.youtube.com/embed/${encodeURIComponent(videoId)}` : url;
            } catch {
                return url;
            }
        }

        function safeExternalUrl(value) {
            try {
                const url = new URL(value, window.location.href);
                return url.protocol === 'http:' || url.protocol === 'https:' ? url.href : '';
            } catch {
                return '';
            }
        }

        function appendLinkedLine(container, line) {
            const urlPattern = /https?:\/\/[^\s<>"']+/gi;
            let lastIndex = 0;
            let match;

            while ((match = urlPattern.exec(line))) {
                let rawUrl = match[0];
                let trailing = '';
                while (/[.,!?;:)]$/.test(rawUrl)) {
                    trailing = rawUrl.slice(-1) + trailing;
                    rawUrl = rawUrl.slice(0, -1);
                }

                const href = safeExternalUrl(rawUrl);
                if (!href) {
                    continue;
                }
                container.append(document.createTextNode(line.slice(lastIndex, match.index)));
                const link = document.createElement('a');
                link.href = href;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = rawUrl;
                container.append(link, document.createTextNode(trailing));
                lastIndex = match.index + match[0].length;
            }

            container.append(document.createTextNode(line.slice(lastIndex)));
        }

        function renderLinkedText(container, text) {
            container.replaceChildren();
            const paragraphs = String(text).split(/\n{2,}/);
            paragraphs.forEach(paragraphText => {
                const paragraph = document.createElement('p');
                paragraphText.split('\n').forEach((line, lineIndex) => {
                    if (lineIndex) {
                        paragraph.append(document.createElement('br'));
                    }
                    appendLinkedLine(paragraph, line);
                });
                container.append(paragraph);
            });
        }

        function renderArticle(article) {
            const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const preferredOrigin = isLocalhost ? 'https://ilmnexus.tech' : window.location.origin;
            const articleUrl = `${preferredOrigin}/share/article/${encodeURIComponent(articleId)}`;
            const articleTitle = article.title || 'ILM Nexus News';
            const articleDescription = article.description || article.content || 'Read the latest news and updates from ILM Nexus.';
            const articleImage = article.image || `${preferredOrigin}/image/nexus-learn%20logo.png`;
            const publishedDate = article.dateAdded?.toDate ? article.dateAdded.toDate() : new Date(article.date || Date.now());

            document.title = `${articleTitle} | ILM Nexus News`;
            document.querySelector('meta[name="description"]').content = articleDescription;
            document.getElementById('articleCanonical').href = articleUrl;
            document.getElementById('articleOgTitle').content = articleTitle;
            document.getElementById('articleOgDescription').content = articleDescription;
            document.getElementById('articleOgImage').content = articleImage;
            document.getElementById('articleOgUrl').content = articleUrl;
            document.getElementById('articleTwitterTitle').content = articleTitle;
            document.getElementById('articleTwitterDescription').content = articleDescription;
            document.getElementById('articleTwitterImage').content = articleImage;
            document.getElementById('articleStructuredData').textContent = JSON.stringify({
                '@context': 'https://schema.org',
                '@type': 'NewsArticle',
                headline: articleTitle,
                description: articleDescription,
                image: [articleImage],
                datePublished: publishedDate.toISOString(),
                dateModified: publishedDate.toISOString(),
                mainEntityOfPage: { '@type': 'WebPage', '@id': articleUrl },
                author: { '@type': 'Organization', name: 'Ilm Nexus' },
                publisher: {
                    '@type': 'Organization',
                    name: 'Ilm Nexus',
                    url: 'https://ilmnexus.tech/',
                    logo: { '@type': 'ImageObject', url: 'https://ilmnexus.tech/image/nexus-learn%20logo.png' }
                }
            });
            document.getElementById('articleCover').src = articleImage;
            document.getElementById('articleCover').alt = articleTitle;
            document.getElementById('articleCategory').textContent = article.category || 'ILM Nexus News';
            document.getElementById('articleTitle').textContent = articleTitle;
            document.getElementById('articleIntro').textContent = articleDescription;
            if (!isLocalhost) {
                window.history.replaceState(null, '', articleUrl);
            }
            document.getElementById('articleDate').textContent = `Published ${publishedDate.toLocaleDateString()}`;
            document.getElementById('articleViews').innerHTML = `<i class="far fa-eye"></i> ${(article.views || 0).toLocaleString()} views`;
            renderLinkedText(document.getElementById('articleContent'), article.content || article.description || '');

            if (article.videoUrl) {
                const videoUrl = safeExternalUrl(article.videoUrl);
                const isYoutube = videoUrl.includes('youtube.com') || videoUrl.includes('youtu.be');
                const videoFile = document.getElementById('articleVideoFile');
                const video = document.getElementById('articleVideo');
                if (isYoutube && videoUrl) {
                    video.src = youtubeEmbed(videoUrl);
                    video.hidden = false;
                } else if (videoUrl) {
                    videoFile.src = videoUrl;
                    videoFile.hidden = false;
                }
            }

            const gallery = document.getElementById('articleGallery');
            (article.gallery || []).forEach(imageUrl => {
                const imageSource = safeExternalUrl(imageUrl);
                if (!imageSource) {
                    return;
                }
                const image = document.createElement('img');
                image.src = imageSource;
                image.alt = articleTitle;
                image.loading = 'lazy';
                gallery.appendChild(image);
            });
            document.getElementById('gallerySection').hidden = !gallery.childElementCount;

            const links = document.getElementById('articleLinks');
            (article.socialLinks || []).forEach(linkUrl => {
                const href = safeExternalUrl(linkUrl);
                if (!href) {
                    return;
                }
                const link = document.createElement('a');
                link.href = href;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                const parsedUrl = new URL(href);
                const label = `${parsedUrl.hostname.replace(/^www\./, '')}${parsedUrl.pathname === '/' ? '' : parsedUrl.pathname}`;
                const icon = document.createElement('i');
                icon.className = 'fas fa-arrow-up-right-from-square';
                icon.setAttribute('aria-hidden', 'true');
                link.append(icon, document.createTextNode(` ${label}`));
                links.appendChild(link);
            });
            document.getElementById('linksSection').hidden = !links.childElementCount;

            if (article.link && article.link !== '#') {
                const source = document.getElementById('articleSource');
                const sourceUrl = safeExternalUrl(article.link);
                if (sourceUrl) {
                    source.href = sourceUrl;
                    source.hidden = false;
                }
            }

            document.getElementById('articleShell').hidden = false;
            status.hidden = true;
        }

        document.getElementById('footerYear').textContent = new Date().getFullYear();
        document.getElementById('shareArticleButton').addEventListener('click', async event => {
            const button = event.currentTarget;
            try {
                await navigator.clipboard.writeText(window.location.href);
                button.innerHTML = '<i class="fas fa-check"></i> Link copied';
                setTimeout(() => {
                    button.innerHTML = '<i class="fas fa-link"></i> Copy article link';
                }, 1800);
            } catch (error) {
                status.hidden = false;
                status.textContent = `Could not copy the article link: ${error.message}`;
            }
        });

        async function loadArticle() {
            if (!articleId) {
                status.textContent = 'Article not found.';
                return;
            }

            try {
                const articleSnapshot = await getDoc(doc(db, 'news', articleId));
                if (!articleSnapshot.exists()) {
                    const shareParams = new URLSearchParams(window.location.search);
                    const title = shareParams.get('title');
                    const image = shareParams.get('image');
                    if (!title || !image) {
                        status.textContent = 'This article is not available yet. Migrate the old news into Firebase first.';
                        return;
                    }

                    renderArticle({
                        title,
                        image,
                        description: shareParams.get('description') || '',
                        content: shareParams.get('description') || '',
                        category: shareParams.get('category') || 'ILM Nexus News',
                        date: shareParams.get('date') || ''
                    });
                    return;
                }

                const article = articleSnapshot.data();
                renderArticle(article);
                updateDoc(doc(db, 'news', articleId), { views: increment(1) }).catch(() => {});
            } catch (error) {
                status.textContent = `Could not load article: ${error.message}`;
            }
        }

        loadArticle();
    </script>
</body>
</html>
