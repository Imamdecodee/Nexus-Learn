<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus Chat | ILM Nexus Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
:root{--blue:#0758d8;--navy:#092b68;--ink:#132238;--muted:#687589;--paper:#f4f7fb;--line:#dbe4ef;--soft:#eaf2ff;--green:#11845b;--red:#b42318}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:15px/1.5 'DM Sans',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.chat-shell{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.chat-side{position:sticky;top:0;height:100vh;padding:1.3rem 1rem;color:#dce8ff;background:var(--navy)}.brand{display:flex;align-items:center;gap:.6rem;padding:.3rem .5rem 1.8rem;color:#fff;font:700 1rem 'Space Grotesk',sans-serif}.brand img{width:38px;height:38px;border-radius:50%;background:#fff;object-fit:contain}.side-label{margin:.7rem;color:#9bbaf0;font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.channels{display:grid;gap:.25rem}.channel{display:flex;align-items:center;gap:.6rem;width:100%;padding:.7rem .75rem;border:0;border-radius:6px;text-align:left;color:#c4d6f5;background:transparent}.channel:hover,.channel.active{color:#fff;background:#ffffff20}.channel.locked{opacity:.5}.side-foot{position:absolute;right:1rem;bottom:1rem;left:1rem;color:#9bbaf0;font-size:.78rem}.chat-main{min-width:0}.chat-top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem clamp(1rem,3vw,2.5rem);border-bottom:1px solid var(--line);background:#fff}.chat-top h1{margin:0;font:700 1.5rem 'Space Grotesk',sans-serif}.chat-top p{margin:.2rem 0 0;color:var(--muted);font-size:.82rem}.back{color:var(--blue);font-weight:700}.chat-wrap{width:min(1050px,100%);margin:auto;padding:clamp(1rem,3vw,2.5rem)}.chat-grid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:1rem}.panel{padding:1rem;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 8px 24px #1322380b}.composer{display:grid;gap:.7rem}.composer-row{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}.composer input,.composer select,.composer textarea{width:100%;padding:.7rem;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:#fff}.composer textarea{min-height:90px;resize:vertical}.primary{padding:.7rem 1rem;border:0;border-radius:6px;color:#fff;background:var(--blue);font-weight:700}.feed{display:grid;gap:.8rem;margin-top:1rem}.message{padding:1rem;border-top:1px solid var(--line)}.message-head{display:flex;align-items:center;gap:.6rem}.avatar{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:#fff;background:var(--blue);font-weight:700}.message-head time{margin-left:auto;color:var(--muted);font-size:.75rem}.message p{margin:.6rem 0 0}.message a{display:block;margin-top:.5rem;color:var(--blue);font-size:.82rem;overflow-wrap:anywhere}.filters{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0}.filter{padding:.4rem .65rem;border:1px solid var(--line);border-radius:99px;color:var(--muted);background:#fff;font-size:.78rem}.filter.active{color:#fff;border-color:var(--blue);background:var(--blue)}.widget h3{margin:0 0 .5rem;font-size:1rem}.widget p,.widget li{color:var(--muted);font-size:.84rem}.widget ul{margin:.4rem 0 0;padding-left:1.1rem}.notice{padding:2rem;text-align:center;color:var(--muted)}.error{color:var(--red)}@media(max-width:800px){.chat-shell{grid-template-columns:1fr}.chat-side{position:static;height:auto;padding:1rem}.channels{display:flex;overflow:auto}.channel{min-width:max-content}.side-foot{display:none}.chat-grid{grid-template-columns:1fr}.composer-row{grid-template-columns:1fr}}
</style>
</head>
<body><div id="app"><main class="notice">Checking your student session...</main></div>
<script type="module">
import { db, firestoreModule, portalAuth } from './portal/firebase.js';
const { addDoc, collection, onSnapshot, serverTimestamp } = firestoreModule;
const channels = [
  { id:'general-chat', label:'General Chat', icon:'fa-comments', course:null },
  { id:'frontend-dev', label:'Frontend Dev', icon:'fa-code', course:'frontend' },
  { id:'graphics-design', label:'Graphics Design', icon:'fa-pen-nib', course:'graphic' },
  { id:'ui-ux-strategy', label:'UI/UX Strategy', icon:'fa-pen-ruler', course:'ui/ux' },
  { id:'data-analysis', label:'Data Analysis', icon:'fa-chart-column', course:'data' },
  { id:'digital-marketing', label:'Digital Marketing', icon:'fa-bullhorn', course:'marketing' },
  { id:'cybersecurity', label:'Cybersecurity', icon:'fa-shield-halved', course:'cybersecurity' }
];
const student = JSON.parse(localStorage.getItem('student_data') || 'null');
const TEMP_CHAT_ACCESS_EMAILS = [
  'theilmnexus@gmail.com',
  'notify@example.com',
  'hassansummayat@gmail.com',
  'abduljeleelroheemoh9ischs@gmail.com',
  'usmanlawal0505@gmail.com',
  'darlingtonoluwajuwon@gmail.com',
  'gbaiyebaliqess123@gmail.com',
  'ytadeboye@gmail.com',
  'nasaleabdulmusawwir@gmail.com',
  'yakubualhajiali@gmail.com',
  'yusrah0508@gmail.com',
  'vadeniyi277@gmail.com',
  'omagbemibest004@gmail.com',
  'koladedaniel101@gmail.com',
  'balogunmariam0003@gmail.com',
  'fatimasagirimamv@gmail.com',
  'joshuapheobe14@gmail.com',
  'ajejehalima9@gmail.com',
  'johnritaajayi22@gmail.com',
  'yussufabdulwarith@gmail.com',
  'visitisha9@gmail.com',
  'ayubaabdulsalam06@gmail.com',
  'muhammedjamiuabdulazeez2@gmail.com',
  'osofisanajibolaelijah@gmail.com',
  'normanalamin103@gmail.com',
  'lagbaluhalimat@gmail.com',
  'abdullahiabubakri4@gmail.com',
  'femie561@gmail.com',
  'careerbuilderspecialist@gmail.com',
  'tobisalawu4@gmail.com'
];
const temporaryChatAccess = !!student && TEMP_CHAT_ACCESS_EMAILS.includes(String(student.email || '').trim().toLowerCase());
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' }[character]));
const courseText = String(student?.course || '').toLowerCase();
const allowed = channel => !channel.course || courseText.includes(channel.course) || student?.role === 'Staff' || student?.role === 'Admin' || temporaryChatAccess;
let activeChannel = channels.find(allowed) || channels[0]; let activeFilter = 'All'; let stopMessages = null;

const user = temporaryChatAccess
  ? { uid: student.uid || `temp-${String(student.email || 'chat').replace(/[^a-z0-9]/gi, '').slice(0, 20)}`, email: student.email, displayName: student.name || student.email }
  : await new Promise(resolve => { const stop = portalAuth.onAuthStateChanged(current => { stop(); resolve(current); }); });
if (!student || (!temporaryChatAccess && (!user || !['Student','Staff'].includes(student.role || 'Student')))) { window.location.href = 'login.html'; throw new Error('Nexus Chat requires an enrolled authenticated user.'); }

document.getElementById('app').innerHTML = `<div class="chat-shell"><aside class="chat-side"><a class="brand" href="dashboard.html"><img src="./image/nexus-learn logo.png" alt="ILM Nexus"><span>ILM Nexus Academy</span></a><p class="side-label">Nexus Chat</p><nav class="channels">${channels.map(channel => `<button class="channel ${allowed(channel) ? '' : 'locked'} ${channel.id === activeChannel.id ? 'active' : ''}" data-channel="${channel.id}" ${allowed(channel) ? '' : 'disabled'}><i class="fas ${channel.icon}"></i><span># ${channel.label}</span>${allowed(channel) ? '' : '<i class="fas fa-lock" style="margin-left:auto"></i>'}</button>`).join('')}</nav><div class="side-foot">Private enrolled workspace</div></aside><main class="chat-main"><header class="chat-top"><div><h1>Nexus Chat</h1><p>Private classroom discussion for ${escapeHtml(student.name || user.email)}</p></div><a class="back" href="dashboard.html">Back to dashboard</a></header><div class="chat-wrap"><div class="chat-grid"><section><div class="panel"><div class="message-head"><div><strong id="channelTitle"></strong><p id="channelDescription" style="margin:.2rem 0;color:var(--muted);font-size:.82rem">Share questions, resources, and project progress.</p></div></div><div class="filters"><button class="filter active" data-filter="All">All posts</button><button class="filter" data-filter="Questions">Questions</button><button class="filter" data-filter="Resources">Resources</button><button class="filter" data-filter="Announcements">Announcements</button></div><form class="composer" id="messageForm"><div class="composer-row"><label>Post category<select name="category"><option>Questions</option><option>Resources</option><option>Announcements</option></select></label><label>Link attachment<input name="link" type="url" placeholder="https://..."></label></div><textarea name="content" placeholder="Start a private conversation, share a project update, or ask a question..." required maxlength="2000"></textarea><button class="primary" type="submit"><i class="fas fa-paper-plane"></i> Send message</button><p class="error" id="messageError"></p></form></div><div class="panel feed" id="messageFeed"><div class="notice">Loading channel messages...</div></div></section><aside><div class="panel widget"><h3><i class="fas fa-lock"></i> Enrolled access</h3><p>Only authenticated students and staff can enter this workspace. Track channels unlock when your enrollment matches the course.</p></div><div class="panel widget" style="margin-top:1rem"><h3><i class="fas fa-thumbtack"></i> Classroom guide</h3><ul><li>Ask clear questions.</li><li>Share useful resources.</li><li>Keep project work respectful.</li></ul></div></aside></div></div></main></div>`;

function renderMessages(snapshot) { const posts = snapshot.docs.map(item => ({ id:item.id, ...item.data() })).sort((a,b) => String(b.createdAt?.seconds || '').localeCompare(String(a.createdAt?.seconds || ''))).filter(post => activeFilter === 'All' || post.category === activeFilter); const feed = document.getElementById('messageFeed'); feed.innerHTML = posts.length ? posts.map(post => `<article class="message"><div class="message-head"><span class="avatar">${escapeHtml(String(post.memberName || 'M').charAt(0).toUpperCase())}</span><strong>${escapeHtml(post.memberName || 'Member')}</strong><time>${post.createdAt?.toDate ? post.createdAt.toDate().toLocaleString() : 'Recently'}</time></div><p>${escapeHtml(post.content)}</p>${post.link ? `<a href="${escapeHtml(post.link)}" target="_blank" rel="noopener">Open attachment</a>` : ''}</article>`).join('') : '<div class="notice">No messages in this channel yet.</div>'; }
function selectChannel(channel) { activeChannel = channel; document.querySelectorAll('.channel').forEach(button => button.classList.toggle('active', button.dataset.channel === channel.id)); document.getElementById('channelTitle').textContent = `# ${channel.label}`; if (stopMessages) stopMessages(); stopMessages = onSnapshot(collection(db, 'channels', channel.id, 'messages'), renderMessages, error => { document.getElementById('messageFeed').innerHTML = `<div class="notice error">${escapeHtml(error.message)}</div>`; }); }

document.getElementById('channelTitle').textContent = `# ${activeChannel.label}`;
document.querySelectorAll('.channel').forEach(button => button.addEventListener('click', () => selectChannel(channels.find(channel => channel.id === button.dataset.channel))));
document.querySelectorAll('.filter').forEach(button => button.addEventListener('click', () => { activeFilter = button.dataset.filter; document.querySelectorAll('.filter').forEach(item => item.classList.toggle('active', item === button)); selectChannel(activeChannel); }));
document.getElementById('messageForm').addEventListener('submit', async event => { event.preventDefault(); const formElement = event.currentTarget; const form = new FormData(formElement); const error = document.getElementById('messageError'); try { await addDoc(collection(db, 'channels', activeChannel.id, 'messages'), { memberId:user.uid, memberName:student.name || user.displayName || user.email, memberEmail:user.email, memberRole:student.role || 'Student', category:String(form.get('category')), content:String(form.get('content')).trim(), link:String(form.get('link')).trim(), createdAt:serverTimestamp() }); formElement.reset(); error.textContent = ''; } catch (failure) { error.textContent = failure.message || 'Message could not be sent.'; } });
selectChannel(activeChannel);
</script></body></html>
