<!DOCTYPE html>
<html lang="en">

  <title>Services Admin | ILM Nexus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --blue:#246bfe; --navy:#14213d; --gold:#ef9c18; --muted:#667085; --paper:#f5f8fc; --line:#dbe3ef; }
    * { box-sizing:border-box; } body { margin:0; color:var(--navy); background:var(--paper); font:15px/1.55 'DM Sans',sans-serif; } .wrap { width:min(1200px,calc(100% - 2rem)); margin:auto; } header { background:#fff; border-bottom:1px solid var(--line); } nav { min-height:72px; display:flex; align-items:center; justify-content:space-between; gap:1rem; } nav img { width:115px; } a { color:var(--blue); font-weight:700; text-decoration:none; } main { padding:3rem 0; } h1,h2 { font-family:'Space Grotesk',sans-serif; } .eyebrow { color:var(--blue); font-size:.75rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; } .panel { padding:1.5rem; margin-top:1.5rem; background:#fff; border:1px solid var(--line); box-shadow:0 8px 24px rgba(20,33,61,.05); } .form-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:1rem; } label { display:grid; gap:.35rem; font-weight:700; } label.full { grid-column:1/-1; } input,select,textarea { width:100%; padding:.7rem; border:1px solid var(--line); border-radius:6px; font:inherit; } textarea { min-height:90px; } button { border:0; border-radius:6px; padding:.7rem 1rem; color:#fff; background:var(--blue); font:700 1rem inherit; cursor:pointer; } button.secondary { background:var(--navy); } button.danger { background:#b42318; } .notice { margin-top:1rem; padding:.8rem; background:#fff4e5; color:#7a4b00; } .hidden { display:none!important; } .service-list,.request-list { display:grid; gap:.8rem; } .row { display:grid; grid-template-columns:1.5fr 1fr 1fr auto; align-items:center; gap:1rem; padding:1rem; border:1px solid var(--line); } .row small { display:block; color:var(--muted); } .actions { display:flex; gap:.5rem; flex-wrap:wrap; } .status { padding:.35rem .55rem; border-radius:4px; color:#12633b; background:#e9f7ef; font-size:.8rem; font-weight:700; } @media(max-width:750px) { .form-grid,.row { grid-template-columns:1fr; } .actions button { width:100%; } }
+  </style>
+</head>
+<body>
+  <header><nav class="wrap"><a href="index.html"><img src="./image/nexus-learn logo.png" alt="ILM Nexus"></a><a href="services.html">View public services</a></nav></header>
+  <main class="wrap"><p class="eyebrow">ILM Nexus admin</p><h1>Services and requests</h1><p>Manage the catalogue, pricing and customer workflow from one authenticated workspace.</p>
+    <section id="loginPanel" class="panel"><h2>Admin sign in</h2><form id="loginForm" class="form-grid"><label>Email<input id="adminEmail" type="email" value="theilmnexus@gmail.com" required></label><label>Password<input id="adminPassword" type="password" required></label><div><button type="submit">Sign in</button></div></form><div id="loginMessage" class="notice hidden"></div></section>
+    <div id="adminWorkspace" class="hidden"><section class="panel"><h2>Add or edit service</h2><form id="serviceForm" class="form-grid"><input id="serviceId" type="hidden"><label>Service name<input id="serviceName" required placeholder="A5 Flyer Printing"></label><label>Category<input id="serviceCategory" required placeholder="Printing"></label><label class="full">Description<textarea id="serviceDescription" required></textarea></label><label>Price type<select id="priceType"><option value="fixed">Fixed Price</option><option value="starting">Starting From</option><option value="per_page">Price Per Page</option><option value="per_piece">Price Per Piece</option><option value="per_100">Price Per 100</option><option value="quote">Request Quote</option></select></label><label>Price<input id="servicePrice" type="number" min="0" placeholder="10000"></label><label>Unit<input id="serviceUnit" placeholder="page, piece, 100"></label><label>Minimum quantity<input id="serviceMinimum" type="number" min="1" value="1"></label><label>Status<select id="serviceStatus"><option value="published">Published</option><option value="draft">Draft</option><option value="hidden">Hidden</option></select></label><label class="full">Specifications<textarea id="serviceSpecs" placeholder="Size, paper type, colour, finishing, binding..."></textarea></label><div class="actions"><button type="submit">Save service</button><button id="clearService" class="secondary" type="button">Clear</button></div></form><div id="serviceMessage" class="notice hidden"></div></section><section class="panel"><h2>Products & services</h2><div id="serviceList" class="service-list">Loading...</div></section><section class="panel"><h2>Service requests</h2><div id="requestList" class="request-list">Loading...</div></section></div>
+  </main>
+  <script type="module">
+    import { addDoc, collection, deleteDoc, doc, getDocs, getFirestore, orderBy, query, serverTimestamp, updateDoc } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';
+    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
+    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
+    const app = initializeApp({ apiKey:'AIzaSyBJKtNJDIxbo-_PxSwGTYcuS8gRjg9ReX8', authDomain:'ilmnexusnews.firebaseapp.com', projectId:'ilmnexusnews', storageBucket:'ilmnexusnews.firebasestorage.app', messagingSenderId:'434251311563', appId:'1:434251311563:web:0264d1049c463369862e4e' });
+    const auth = getAuth(app); const db = getFirestore(app); const adminEmail = 'theilmnexus@gmail.com';
+    const $ = id => document.getElementById(id); const loginMessage = $('loginMessage'); const serviceMessage = $('serviceMessage');
+    const statusOptions = ['new','reviewing','quoted','awaiting_payment','paid','in_production','ready','dispatched','delivered','completed'];
+    function showMessage(element, text) { element.textContent = text; element.classList.remove('hidden'); }
+    $('loginForm').addEventListener('submit', async event => { event.preventDefault(); try { await signInWithEmailAndPassword(auth, $('adminEmail').value, $('adminPassword').value); } catch (error) { showMessage(loginMessage, `Sign in failed: ${error.message}`); } });
+    onAuthStateChanged(auth, user => { const allowed = user && user.email === adminEmail; $('loginPanel').classList.toggle('hidden', Boolean(allowed)); $('adminWorkspace').classList.toggle('hidden', !allowed); if (allowed) { loadServices(); loadRequests(); } });
+    function resetServiceForm() { $('serviceForm').reset(); $('serviceId').value = ''; $('serviceMinimum').value = '1'; }
+    $('clearService').addEventListener('click', resetServiceForm);
+    $('serviceForm').addEventListener('submit', async event => { event.preventDefault(); const data = { name:$('serviceName').value.trim(), category:$('serviceCategory').value.trim(), description:$('serviceDescription').value.trim(), priceType:$('priceType').value, price:Number($('servicePrice').value || 0), unit:$('serviceUnit').value.trim(), minimumQuantity:Number($('serviceMinimum').value || 1), specifications:$('serviceSpecs').value.trim(), status:$('serviceStatus').value }; try { if ($('serviceId').value) await updateDoc(doc(db, 'services', $('serviceId').value), data); else await addDoc(collection(db, 'services'), { ...data, currency:'₦', createdAt:serverTimestamp(), updatedAt:serverTimestamp() }); showMessage(serviceMessage, 'Service saved. The public catalogue will show it when published.'); resetServiceForm(); loadServices(); } catch (error) { showMessage(serviceMessage, `Could not save service: ${error.message}`); } });
+    async function loadServices() { const list = $('serviceList'); try { const snapshot = await getDocs(query(collection(db, 'services'), orderBy('createdAt', 'desc'))); if (snapshot.empty) { list.textContent = 'No services yet. Add the first product above.'; return; } list.innerHTML = ''; snapshot.forEach(item => { const service = item.data(); const row = document.createElement('div'); row.className = 'row'; row.innerHTML = `<div><strong>${service.name || 'Unnamed service'}</strong><small>${service.category || ''}</small></div><div>${service.priceType === 'quote' ? 'Request Quote' : `₦${Number(service.price || 0).toLocaleString()} ${service.unit ? `/ ${service.unit}` : ''}`}</div><div><span class="status">${service.status || 'draft'}</span></div><div class="actions"><button data-edit="${item.id}">Edit</button><button class="danger" data-delete="${item.id}">Delete</button></div>`; list.appendChild(row); }); list.querySelectorAll('[data-edit]').forEach(button => button.addEventListener('click', () => editService(button.dataset.edit))); list.querySelectorAll('[data-delete]').forEach(button => button.addEventListener('click', () => removeService(button.dataset.delete))); } catch (error) { list.textContent = `Could not load services: ${error.message}`; } }
+    async function editService(id) { const snapshot = await getDocs(collection(db, 'services')); const item = snapshot.docs.find(entry => entry.id === id); if (!item) return; const service = item.data(); $('serviceId').value = id; $('serviceName').value = service.name || ''; $('serviceCategory').value = service.category || ''; $('serviceDescription').value = service.description || ''; $('priceType').value = service.priceType || 'quote'; $('servicePrice').value = service.price || ''; $('serviceUnit').value = service.unit || ''; $('serviceMinimum').value = service.minimumQuantity || 1; $('serviceStatus').value = service.status || 'draft'; $('serviceSpecs').value = service.specifications || ''; window.scrollTo({ top:0, behavior:'smooth' }); }
+    async function removeService(id) { if (!window.confirm('Delete this service?')) return; await deleteDoc(doc(db, 'services', id)); loadServices(); }
+    async function loadRequests() { const list = $('requestList'); try { const snapshot = await getDocs(query(collection(db, 'serviceRequests'), orderBy('createdAt', 'desc'))); if (snapshot.empty) { list.textContent = 'No customer requests yet.'; return; } list.innerHTML = ''; snapshot.forEach(item => { const request = item.data(); const row = document.createElement('div'); row.className = 'row'; row.innerHTML = `<div><strong>${request.requestId || item.id}</strong><small>${request.name || ''} · ${request.phone || ''}</small></div><div>${(request.services || []).join(', ')}</div><div><select data-status="${item.id}">${statusOptions.map(status => `<option ${status === request.status ? 'selected' : ''} value="${status}">${status.replaceAll('_',' ')}</option>`).join('')}</select></div><div><small>${request.city || ''}, ${request.state || ''}</small></div>`; list.appendChild(row); }); list.querySelectorAll('[data-status]').forEach(select => select.addEventListener('change', async () => { await updateDoc(doc(db, 'serviceRequests', select.dataset.status), { status:select.value, updatedAt:serverTimestamp() }); })); } catch (error) { list.textContent = `Could not load requests: ${error.message}`; } }
+  </script>
+</body>
+</html>
