<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set New Password | ILM Nexus</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>:root{--blue:#246bfe;--navy:#14213d;--muted:#667085;--line:#dbe3ef;--paper:#f5f8fc}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:1rem;background:var(--paper);color:var(--navy);font:15px/1.5 'DM Sans',sans-serif}.card{width:min(430px,100%);padding:2rem;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 18px 50px #14213d18}h1{margin:0;font:700 2rem 'Space Grotesk',sans-serif}.eyebrow{color:var(--blue);font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}p{color:var(--muted)}label{display:grid;gap:.35rem;margin-top:1rem;font-weight:700}input{width:100%;padding:.8rem;border:1px solid var(--line);border-radius:7px;font:inherit}button{width:100%;margin-top:1.2rem;padding:.8rem;border:0;border-radius:7px;color:#fff;background:var(--blue);font:700 1rem 'DM Sans',sans-serif;cursor:pointer}.message{min-height:1.3rem;color:#b42318;font-size:.85rem}</style></head>
<body><main class="card"><p class="eyebrow">First login protection</p><h1>Set your new password.</h1><p>Your first password was assigned by ILM Nexus. Choose a private password before opening your dashboard.</p><form id="resetForm"><label>New password<input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></label><label>Confirm password<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></label><p class="message" id="message"></p><button type="submit">Save password and continue</button></form></main><script type="module">import{portalAuth}from'./portal/firebase.js';import{updatePassword}from'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';const student=JSON.parse(localStorage.getItem('student_data')||'null');if(!student)location.href='login.html';document.getElementById('resetForm').addEventListener('submit',async event=>{event.preventDefault();const password=document.getElementById('newPassword').value;const confirm=document.getElementById('confirmPassword').value;const message=document.getElementById('message');if(password!==confirm){message.textContent='Passwords do not match.';return}if(password.length<8){message.textContent='Use at least 8 characters.';return}try{const user=portalAuth.auth.currentUser;if(user)await updatePassword(user,password);const next={...student,password,forcePasswordReset:false};localStorage.setItem('student_data',JSON.stringify(next));localStorage.setItem('registered_student',JSON.stringify(next));localStorage.removeItem('force_password_reset');location.href='dashboard.html'}catch(error){message.textContent=error.code==='auth/requires-recent-login'?'Sign in again, then complete the password reset.':error.message}});</script></body></html>
