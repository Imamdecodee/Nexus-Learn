<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academic Controls | ILM Nexus</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>:root{--blue:#0758d8;--ink:#132238;--muted:#687589;--paper:#f4f7fb;--line:#dbe4ef;--green:#11845b;--red:#b42318}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:15px/1.5 'DM Sans',sans-serif}.wrap{width:min(1000px,calc(100% - 2rem));margin:auto}header{background:#fff;border-bottom:1px solid var(--line)}nav{min-height:72px;display:flex;justify-content:space-between;align-items:center}nav img{width:115px}a{color:var(--blue);font-weight:700;text-decoration:none}main{padding:3rem 0}h1,h2{font-family:'Space Grotesk',sans-serif}.eyebrow{color:var(--blue);font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.panel{padding:1.3rem;margin-top:1.2rem;border:1px solid var(--line);border-radius:9px;background:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}label{display:grid;gap:.35rem;font-weight:700}input,select{width:100%;padding:.72rem;border:1px solid var(--line);border-radius:6px;font:inherit}button{padding:.75rem 1rem;border:0;border-radius:6px;color:#fff;background:var(--blue);font:700 1rem 'DM Sans',sans-serif;cursor:pointer}.hidden{display:none!important}.notice{margin-top:1rem;padding:.8rem;border-radius:6px;color:var(--muted);background:#f8fbff}.success{color:var(--green);background:#edf9f3}.error{color:var(--red);background:#fff0ee}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><header><nav class="wrap"><a href="index.html"><img src="./image/nexus-learn logo.png" alt="ILM Nexus"></a><a href="campus-admin.html">Campus administration</a></nav></header><main class="wrap"><p class="eyebrow">Academic coordination</p><h1>Learning and support controls</h1><p>Manage attendance, scholarships, discounts, and student timetable entries.</p><section class="panel" id="loginPanel"><h2>Coordinator sign in</h2><form id="loginForm" class="grid"><label>Email<input id="email" type="email" value="theilmnexus@gmail.com" required></label><label>Password<input id="password" type="password" required></label><button type="submit">Sign in</button></form><div id="loginMessage" class="notice hidden"></div></section><section class="panel hidden" id="workspace"><div class="grid"><label>Student<select id="student"><option value="">Choose a student</option></select></label><label>Attendance percentage<input id="attendance" type="number" min="0" max="100" placeholder="80"></label><label>Scholarship percentage<input id="scholarship" type="number" min="0" max="100" placeholder="0"></label><label>Discount amount (NGN)<input id="discount" type="number" min="0" placeholder="0"></label><label>Class title<input id="classTitle" placeholder="Frontend development workshop"></label><label>Class date and time<input id="classDate" type="datetime-local"></label><label>Meeting link<input id="meetingUrl" type="url" placeholder="https://meet.google.com/..."></label><label>Cohort or course<input id="cohort" placeholder="Cohort 1.0"></label></div><button id="save" type="button" style="margin-top:1rem">Save academic controls</button><div id="saveMessage" class="notice hidden"></div></section></main><script type="module">import{portalAuth,db,firestoreModule}from'./portal/firebase.js';const{collection,getDocs,doc,updateDoc,addDoc,serverTimestamp,Timestamp}=firestoreModule;const students=new Map();const $=id=>document.getElementById(id);function show(node,text,type=''){node.textContent=text;node.className=`notice ${type}`;node.classList.remove('hidden')}$('loginForm').addEventListener('submit',async event=>{event.preventDefault();try{await portalAuth.signInWithEmail($('email').value,$('password').value);location.reload()}catch(error){show($('loginMessage'),error.message,'error')}});let coordinator=null;try{coordinator=await new Promise(resolve=>{let done=false;const stop=portalAuth.onAuthStateChanged(user=>{if(!done){done=true;stop();resolve(user)}});setTimeout(()=>{if(!done){done=true;stop();resolve(null)}},1500)});if(coordinator){$('loginPanel').classList.add('hidden');$('workspace').classList.remove('hidden');const snapshot=await getDocs(collection(db,'users'));snapshot.forEach(item=>{const student={id:item.id,...item.data()};students.set(item.id,student);const option=document.createElement('option');option.value=item.id;option.textContent=`${student.name||student.email||item.id} · ${student.course||'No course'}`;$('student').appendChild(option)})}}catch(error){show($('loginMessage'),error.message,'error')}$('student').addEventListener('change',()=>{const item=students.get($('student').value);if(!item)return;$('attendance').value=item.attendancePercent||'';$('scholarship').value=item.scholarshipPercent||'';$('discount').value=item.discountAmount||''});$('save').addEventListener('click',async()=>{const id=$('student').value;if(!id){show($('saveMessage'),'Choose a student first.','error');return}try{await updateDoc(doc(db,'users',id),{attendancePercent:Number($('attendance').value||0),scholarshipPercent:Number($('scholarship').value||0),discountAmount:Number($('discount').value||0),updatedAt:serverTimestamp()});if($('classTitle').value&&$('classDate').value)await addDoc(collection(db,'timetables'),{userId:id,title:$('classTitle').value.trim(),startsAt:Timestamp.fromDate(new Date($('classDate').value)),meetingUrl:$('meetingUrl').value.trim(),cohortId:$('cohort').value.trim(),createdBy:coordinator.uid,createdAt:serverTimestamp()});show($('saveMessage'),'Academic controls saved successfully.','success')}catch(error){show($('saveMessage'),error.message,'error')}});</script></body></html>
