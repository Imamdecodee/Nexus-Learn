<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificate Control | ILM Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>:root{--blue:#0758d8;--ink:#132238;--muted:#687589;--paper:#f4f7fb;--line:#dbe4ef;--green:#11845b;--red:#b42318}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:15px/1.5 'DM Sans',sans-serif}.wrap{width:min(1100px,calc(100% - 2rem));margin:auto}header{background:#fff;border-bottom:1px solid var(--line)}nav{min-height:72px;display:flex;justify-content:space-between;align-items:center}nav img{width:115px}a{color:var(--blue);font-weight:700;text-decoration:none}main{padding:3rem 0}h1,h2{font-family:'Space Grotesk',sans-serif}.eyebrow{color:var(--blue);font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.panel{padding:1.3rem;margin-top:1.2rem;border:1px solid var(--line);border-radius:9px;background:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}label{display:grid;gap:.35rem;font-weight:700}input,select,textarea{width:100%;padding:.72rem;border:1px solid var(--line);border-radius:6px;font:inherit}textarea{min-height:90px}button{padding:.75rem 1rem;border:0;border-radius:6px;color:#fff;background:var(--blue);font:700 1rem 'DM Sans',sans-serif;cursor:pointer}.hidden{display:none!important}.notice{margin-top:1rem;padding:.8rem;border-radius:6px;color:var(--muted);background:#f8fbff}.success{color:var(--green);background:#edf9f3}.error{color:var(--red);background:#fff0ee}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin-top:1rem}.summary div{padding:.8rem;border:1px solid var(--line);border-radius:6px}.summary small{display:block;color:var(--muted)}.summary strong{display:block;margin-top:.2rem}@media(max-width:700px){.grid,.summary{grid-template-columns:1fr}.wrap{width:min(100% - 1rem,1100px)}}
</style>
</head>
<body><header><nav class="wrap"><a href="index.html"><img src="./image/nexus-learn logo.png" alt="ILM Nexus"></a><a href="campus-admin.html">Campus administration</a></nav></header><main class="wrap"><p class="eyebrow">Academic coordination</p><h1>Certificate and fee control</h1><p>Confirm offline payments, review student projects, approve certificate access, and issue verification codes.</p><section class="panel" id="loginPanel"><h2>Coordinator sign in</h2><form id="loginForm" class="grid"><label>Email<input id="email" type="email" value="theilmnexus@gmail.com" required></label><label>Password<input id="password" type="password" required></label><button type="submit">Sign in securely</button></form><div class="notice hidden" id="loginMessage"></div></section><section class="panel hidden" id="workspace"><div class="grid"><label>Student<select id="studentSelect"><option value="">Choose a student</option></select></label><label>Payment amount received<input id="paymentAmount" type="number" min="0" placeholder="0"></label><label>Payment reference<input id="paymentReference" placeholder="Bank transfer reference"></label><label>Payment method<select id="paymentMethod"><option>Bank transfer</option><option>Cash office confirmation</option><option>Other offline method</option></select></label><label>Project review status<select id="reviewStatus"><option>Not Submitted</option><option>Submitted</option><option>Under Review</option><option>Approved</option><option>Revision Required</option></select></label><label>Certificate access<select id="certificateStatus"><option>Not Approved</option><option>Approved</option></select></label><label>Verification code<input id="verificationCode" placeholder="Issue only after approval"></label><label>Coordinator note<textarea id="note" placeholder="Internal review or payment note"></textarea></label></div><div class="summary" id="studentSummary"></div><button id="saveButton" type="button" style="margin-top:1rem">Save coordinator decision</button><div class="notice hidden" id="saveMessage"></div></section></main>
<script type="module">
import { portalAuth, db, firestoreModule } from './portal/firebase.js';
import { hashCertificateCode } from './portal/certificate-eligibility.js';
const { collection, getDocs, doc, updateDoc, addDoc, serverTimestamp } = firestoreModule;
const students = new Map(); let coordinator = null;
const $ = id => document.getElementById(id);
function show(node, text, type = '') { node.textContent = text; node.className = `notice ${type}`; node.classList.remove('hidden'); }
$('loginForm').addEventListener('submit', async event => { event.preventDefault(); try { await portalAuth.signInWithEmail($('email').value, $('password').value); location.reload(); } catch (error) { show($('loginMessage'), error.message, 'error'); } });
try {
  coordinator = await new Promise(resolve => { let done = false; const stop = portalAuth.onAuthStateChanged(user => { if (!done) { done = true; stop(); resolve(user); } }); setTimeout(() => { if (!done) { done = true; stop(); resolve(null); } }, 1500); });
  if (coordinator) { $('loginPanel').classList.add('hidden'); $('workspace').classList.remove('hidden'); const snapshot = await getDocs(collection(db, 'users')); snapshot.forEach(item => { const student = { id: item.id, ...item.data() }; students.set(item.id, student); const option = document.createElement('option'); option.value = item.id; option.textContent = `${student.name || student.email || item.id} · ${student.course || 'No course'}`; $('studentSelect').appendChild(option); }); }
} catch (error) { show($('loginMessage'), error.message, 'error'); }
function renderStudent() { const student = students.get($('studentSelect').value); if (!student) { $('studentSummary').innerHTML = ''; return; } $('reviewStatus').value = student.projectReviewStatus || 'Not Submitted'; $('certificateStatus').value = student.certificateStatus || 'Not Approved'; $('studentSummary').innerHTML = `<div><small>Course</small><strong>${student.course || 'Not assigned'}</strong></div><div><small>Required fee</small><strong>NGN ${Number(student.requiredFee || 0).toLocaleString()}</strong></div><div><small>Paid</small><strong>NGN ${Number(student.amountPaid || 0).toLocaleString()}</strong></div><div><small>Balance</small><strong>NGN ${Number(student.outstandingBalance || 0).toLocaleString()}</strong></div>`; }
$('studentSelect').addEventListener('change', renderStudent);
$('saveButton').addEventListener('click', async () => { const id = $('studentSelect').value; const student = students.get(id); if (!student) { show($('saveMessage'), 'Choose a student first.', 'error'); return; } const amount = Number($('paymentAmount').value || 0); const totalPaid = Number(student.amountPaid || 0) + amount; const balance = Math.max(Number(student.requiredFee || 0) - totalPaid, 0); const reviewStatus = $('reviewStatus').value; const certificateStatus = $('certificateStatus').value; const code = $('verificationCode').value.trim(); if (certificateStatus === 'Approved' && !code) { show($('saveMessage'), 'Issue a verification code before approving certificate access.', 'error'); return; } try { const codeHash = code ? await hashCertificateCode(code) : null; await updateDoc(doc(db, 'users', id), { amountPaid: totalPaid, outstandingBalance: balance, feeStatus: balance === 0 ? 'Fully Paid' : totalPaid > 0 ? 'Partially Paid' : 'Payment Pending', projectReviewStatus: reviewStatus, projectReviewNote: $('note').value.trim(), certificateStatus, certificateVerificationCodeHash: codeHash, certificateIssuedAt: certificateStatus === 'Approved' ? serverTimestamp() : null, updatedAt: serverTimestamp() }); if (amount > 0) await addDoc(collection(db, 'payment_records'), { userId: id, amount, currency: 'NGN', method: $('paymentMethod').value, reference: $('paymentReference').value.trim(), paymentDate: serverTimestamp(), verifiedBy: coordinator.uid, verifiedAt: serverTimestamp(), note: $('note').value.trim() }); students.set(id, { ...student, amountPaid: totalPaid, outstandingBalance: balance, projectReviewStatus: reviewStatus, certificateStatus, certificateVerificationCodeHash: codeHash }); renderStudent(); show($('saveMessage'), 'Coordinator decision saved successfully.', 'success'); } catch (error) { show($('saveMessage'), error.message, 'error'); } });
</script></body></html>
